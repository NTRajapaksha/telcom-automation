site_types:
  rooftop:
    checks: [rnp, transmission, power]
  greenfield:
    checks: [rnp, transmission, power, civil_works]

checks:
  rnp:
    severity: BLOCKING
    max_load_pct_for_review: 95
    min_load_pct_to_justify_upgrade: 80

  transmission:
    severity: DEGRADING
    min_spare_capacity_pct: 10

  power:
    severity: BLOCKING
    min_headroom_kw: 0.0

  civil_works:
    severity: BLOCKING
    required_for_site_types: [greenfield]
